name: Main

permissions:
  contents: read

on:
  push:
    branches: [main]
  schedule:
    - cron: "37 7,19 * * *"

jobs:
  tests:
    name: Test
    uses: swiftlang/github-workflows/.github/workflows/package_test.yml@main
    with:
      name: tests
      swift_flags: "-Xswiftc -warnings-as-errors"
      swift_nightly_flags: "-Xswiftc -warnings-as-errors"

      # Linux
      linux_swift_versions: '["6.4", "nightly-release"]'
      linux_command: &linux_command |
        Build: swift build --build-tests --quiet
        Build-Additive-Traits: swift build --build-tests --quiet --traits DatapathLogging,QlogOutput,SignpostOutput
        Build-Reductive-Traits: swift build --build-tests --quiet --traits DisableDebugLogging,DisableErrorLogging
        Test-Debug: swift test --quiet
        Test-Release: swift test --quiet -c release
      linux_static_sdk_versions: '["6.4", "nightly-release"]'

      # Android
      android_sdk_versions: '["6.4", "nightly-release"]'

      # macOS
      macos_swift_versions: '["6.4"]'
      macos_command: |
        Apple: bash .github/workflows/scripts/ci-macos.sh
        iOS: bash .github/workflows/scripts/ci-ios.sh

      # Not run by this package.
      enable_windows: false
      enable_macos_swiftly: false
      enable_wasm_sdk_build: false
      enable_embedded_wasm_sdk_build: false
      enable_cxx_interop: false

  tests-real-time:
    name: Test (real time)
    uses: swiftlang/github-workflows/.github/workflows/package_test.yml@main
    with:
      name: tests-real-time
      swift_flags: "-Xswiftc -warnings-as-errors -Xswiftc -DSWIFT_NETWORK_TEST_REAL_TIME"
      swift_nightly_flags: "-Xswiftc -warnings-as-errors -Xswiftc -DSWIFT_NETWORK_TEST_REAL_TIME"

      # Linux
      linux_swift_versions: '["6.4"]'
      linux_command: *linux_command

      # macOS
      macos_swift_versions: '["6.4"]'
      macos_command: bash .github/workflows/scripts/ci-macos.sh

      # Not run by this package.
      enable_windows: false
      enable_macos_swiftly: false
      enable_linux_static_sdk_build: false
      enable_wasm_sdk_build: false
      enable_embedded_wasm_sdk_build: false
      enable_android_sdk_build: false
      enable_android_emulator_tests: false
      enable_cxx_interop: false

  tests-nightly-main:
    # Keep this separate so that it can be disabled if the nightly compiler shows any issue.
    name: Test (nightly-main)
    uses: swiftlang/github-workflows/.github/workflows/package_test.yml@main
    with:
      name: tests-nightly-main
      swift_nightly_flags: "-Xswiftc -warnings-as-errors"

      # Linux
      linux_swift_versions: '["nightly-main"]'
      linux_command: *linux_command
      linux_static_sdk_versions: '["nightly-main"]'

      # Android
      android_sdk_versions: '["nightly-main"]'

      # Not run by this package.
      enable_macos: false
      enable_windows: false
      enable_macos_swiftly: false
      enable_wasm_sdk_build: false
      enable_embedded_wasm_sdk_build: false
      enable_cxx_interop: false
